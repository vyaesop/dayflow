name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -w @dayflow/api
      - run: npm run build -w @dayflow/api

  mobile:
    name: Mobile · analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The e2e suite needs a live API + database, so it stays a local tool;
      # excluding it here keeps CI green from meaning "nothing actually ran".
      - run: flutter test --exclude-tags e2e
